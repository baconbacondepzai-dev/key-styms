<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaconCopyGame - Get Key Success</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0d0f17; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(0, 255, 170, 0.3); border-radius: 16px; padding: 25px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        h2 { color: #00ffaa; margin-bottom: 10px; text-shadow: 0 0 10px rgba(0,255,170,0.4); }
        p { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        .btn { display: block; width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 8px; font-weight: bold; color: #fff; text-decoration: none; cursor: pointer; transition: 0.3s; font-size: 14px; }
        .btn-24h { background: linear-gradient(90deg, #ff8c00, #e52d27); }
        .btn-16h { background: linear-gradient(90deg, #00c6ff, #0072ff); }
        .btn-6h { background: linear-gradient(90deg, #11998e, #38ef7d); }
        .btn-copy { background: #00ffaa; color: #000; font-size: 16px; margin-top: 15px; }
        
        /* Box hiển thị Key */
        .key-box { margin-top: 15px; padding: 15px; background: rgba(0,0,0,0.5); border: 2px dashed #00ffaa; border-radius: 10px; }
        .key-text { color: #00ffaa; font-family: monospace; font-size: 18px; font-weight: bold; word-break: break-all; margin-top: 5px; }
        .success-icon { font-size: 48px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="card">
    <!-- MÀN HÌNH 1: TRANG CHỌN GET KEY (Hiển thị mặc định) -->
    <div id="selectScreen">
        <h2>🔑 BACON GET KEY</h2>
        <p>Chọn loại Key bạn muốn lấy để dùng Script Copy Game</p>

        <!-- THAY LINK WORKINK CỦA BẠN VÀO HREF BÊN DƯỚI -->
        <a href="https://workink.net/your-link-24h?target=https://your-github-username.github.io/index.html?type=24h" class="btn btn-24h">🔥 Vượt Link Key 24 Giờ</a>
        <a href="https://workink.net/your-link-16h?target=https://your-github-username.github.io/index.html?type=16h" class="btn btn-16h">⚡ Vượt Link Key 16 Giờ</a>
        <a href="https://workink.net/your-link-6h?target=https://your-github-username.github.io/index.html?type=6h" class="btn btn-6h">🌱 Vượt Link Key 6 Giờ</a>
    </div>

    <!-- MÀN HÌNH 2: TRANG ĐÃ GET KEY THÀNH CÔNG (Tự mở khi vượt link xong) -->
    <div id="successScreen" style="display: none;">
        <div class="success-icon">🎉</div>
        <h2>GET KEY THÀNH CÔNG!</h2>
        <p>Sao chép Key bên dưới và dán vào Roblox Executer:</p>

        <div class="key-box">
            <span style="font-size: 12px; color: #888;">KEY CỦA BẠN:</span>
            <div id="keyDisplay" class="key-text">---</div>
        </div>

        <button id="copyBtn" class="btn btn-copy" onclick="copyKeyToClipboard()">📋 SAO CHÉP KEY</button>
    </div>
</div>

<script>
    // Hàm sinh Key theo ngày chuẩn UTC (trùng khớp với Script Lua)
    function getTodayUTC() {
        const now = new Date();
        const year = now.getUTCFullYear();
        const month = String(now.getUTCMonth() + 1).padStart(2, '0');
        const day = String(now.getUTCDate()).padStart(2, '0');
        return `${year}${month}${day}`;
    }

    // Đọc URL parameter để xem người dùng đã vượt link về chưa
    const urlParams = new URLSearchParams(window.location.search);
    const keyType = urlParams.get('type');

    if (keyType) {
        // Nếu có tham số ?type=... -> Chuyển sang Màn Hình Thành Công
        document.getElementById('selectScreen').style.display = 'none';
        document.getElementById('successScreen').style.display = 'block';

        const todayStr = getTodayUTC();
        const generatedKey = `BACON_${keyType.toUpperCase()}_${todayStr}_SECRET`;
        
        document.getElementById('keyDisplay').innerText = generatedKey;
    }

    // Hàm Nút Copy Key
    function copyKeyToClipboard() {
        const keyText = document.getElementById('keyDisplay').innerText;
        navigator.clipboard.writeText(keyText).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.innerText = '✅ ĐÃ SAO CHÉP KEY!';
            btn.style.background = '#ffffff';
            setTimeout(() => {
                btn.innerText = '📋 SAO CHÉP KEY';
                btn.style.background = '#00ffaa';
            }, 2000);
        });
    }
</script>

</body>
</html>
